<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aayan Makandar | Portfolio</title>
<style>
:root{--bg:#04070f;--tx:#e8eeff;--mu:#7f93c4;--bl:#2f7bff;--rd:#ff2d55;--bd:rgba(70,110,255,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#1a3aa044,transparent 45%),radial-gradient(circle at 5% 70%,#6a122e33,transparent 45%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
main{max-width:1060px;margin:auto;padding:0 16px}
.mono,.tag,nav{font-family:ui-monospace,Menlo,Consolas,monospace}
nav{display:flex;justify-content:space-between;padding:14px 0;font-size:11px;letter-spacing:.14em;color:var(--mu)}nav a{color:var(--mu);text-decoration:none;margin-left:14px}
.tag{font-size:10.5px;letter-spacing:.18em;color:var(--mu);text-transform:uppercase}
.disp{font-family:Impact,"Arial Narrow Bold",system-ui,sans-serif;text-transform:uppercase;font-weight:900;line-height:.9;letter-spacing:.005em}
h1{font-size:clamp(64px,17vw,140px);margin:6px 0}h1 span{display:block;color:var(--bl);text-shadow:0 0 40px #2f7bff77}
h1 i{display:inline-block;width:30px;height:12px;background:var(--rd);transform:skew(-20deg);margin-left:10px}
h2{font-size:clamp(26px,5vw,40px);margin:4px 0 14px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:end;padding:10px 0 20px;border-bottom:1px solid var(--bd)}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.open{display:inline-block;background:#1b3f9a;border:1px solid var(--bl);padding:3px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.1em;margin-bottom:10px}
.hphoto{position:relative;aspect-ratio:4/5;max-height:520px;justify-self:end;width:100%;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.hphoto img{width:100%;height:100%;object-fit:cover;object-position:top;filter:contrast(1.05)}
.hphoto b{position:absolute;left:8px;bottom:14%;background:#1b3f9aee;border:1px solid var(--bl);padding:6px 12px;font:700 11px ui-monospace,monospace;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mu);font:12px ui-monospace,monospace;padding:14px 0}
.btn{display:inline-block;background:var(--bl);color:#fff;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:700;margin:6px 8px 0 0;border:0;cursor:pointer;font-size:14px}.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;padding:18px 0}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--bd);background:linear-gradient(165deg,#0b1736,#060c1d);padding:16px;position:relative;box-shadow:inset 0 0 30px #2f7bff14}
.panel.r{border-color:#ff2d5566}.panel::after{content:"";position:absolute;right:8px;bottom:8px;width:22px;height:8px;background:var(--rd);transform:skew(-20deg)}
.term{border:1px solid var(--bd);background:#050b1c;margin:12px 0}.term .h{padding:6px 10px;border-bottom:1px solid var(--bd);font:10px ui-monospace,monospace;color:var(--mu)}.term .b{padding:12px}
.cmd{font:12px ui-monospace,monospace;color:#6fe3a4;margin-bottom:10px}
.flow{display:flex;gap:8px;align-items:center}.flow div{flex:1;border:1px solid var(--bl);background:#0c2260;padding:10px 6px;text-align:center;font:700 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.flow div:last-child{border-color:var(--rd);background:#3a0d22}.flow div b{display:block;font-size:18px;color:var(--bl)}.flow div:last-child b{color:var(--rd)}
.feat{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1a2a5a}.feat b{color:var(--tx)}.feat p{margin:0;color:var(--mu);font-size:13px}.feat i{color:var(--bl);font:700 13px ui-monospace,monospace;font-style:normal}
.steps div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1a2a5a;align-items:flex-start}.steps i{color:var(--rd);font:700 18px Impact,sans-serif;font-style:normal}.steps p{margin:0;color:var(--mu);font-size:13px}
.mrow{display:grid;grid-template-columns:130px 1fr;gap:14px;margin-top:6px}@media(max-width:480px){.mrow{grid-template-columns:1fr}}
.mrow img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border:1px solid var(--bd)}
.orbit{position:relative;width:min(100%,300px);aspect-ratio:1;margin:auto}
.orbit .core{position:absolute;inset:34%;border:1px solid var(--bl);background:radial-gradient(#1f4fd6,#07133a);display:grid;place-items:center;font:900 30px Impact,sans-serif;box-shadow:0 0 40px #2f7bffaa;transform:rotate(45deg)}.orbit .core span{transform:rotate(-45deg)}
.ring{position:absolute;border:1px dashed var(--bd);border-radius:50%;animation:sp 40s linear infinite}.ring.a{inset:12%}.ring.b{inset:0;animation-direction:reverse;animation-duration:60s}
.ring em{position:absolute;left:50%;top:0;transform:translate(-50%,-50%) rotate(var(--r));font:700 9px ui-monospace,monospace;font-style:normal;background:#0c2260;border:1px solid var(--rd);padding:3px 6px;white-space:nowrap}
@keyframes sp{to{transform:rotate(360deg)}}
.tgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}.tgrid span{border:1px solid var(--bd);background:#0b1a44;padding:9px 12px;font:700 12px ui-monospace,monospace}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 10px;border:1px solid #223a85;vertical-align:top}th{background:#0b1a44}.tw{overflow-x:auto}
.cred{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:20px 0}@media(max-width:760px){.cred{grid-template-columns:1fr}}
.lan{position:relative;padding-top:60px;width:230px;margin:auto}.lan::before{content:"";position:absolute;left:50%;top:0;width:22px;height:70px;background:linear-gradient(90deg,#1c4ed8,#60a5fa);transform:translateX(-50%)}
.idc{border:2px solid #29b6f6;border-radius:14px;background:linear-gradient(160deg,#0d2a5e,#06122c);padding:12px;box-shadow:0 0 40px #29b6f655;animation:sw 4s ease-in-out infinite;transform-origin:top center}@keyframes sw{50%{transform:rotate(2deg)}}
.idc img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:8px}.idc h4{margin:8px 0 0;font:900 22px Impact,sans-serif;text-transform:uppercase}
.bc{height:26px;margin-top:8px;background:repeating-linear-gradient(90deg,#9fb6e8 0 2px,transparent 2px 4px,#9fb6e8 4px 5px,transparent 5px 8px)}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sts div{border:1px solid var(--bl);background:#0b1a44;padding:12px;text-align:center}.sts div:nth-child(1){border-color:#ff6a3d}.sts b{display:block;font:900 40px/1 Impact,sans-serif;color:var(--tx)}.sts span{font:9.5px ui-monospace,monospace;color:var(--mu);letter-spacing:.14em;text-transform:uppercase}
.bar{margin:12px 0}.bar div{display:flex;justify-content:space-between;font:11.5px ui-monospace,monospace;color:var(--tx)}.bar u{display:block;height:6px;background:#10204f;margin-top:4px}.bar u i{display:block;height:100%;background:linear-gradient(90deg,#29b6f6,var(--bl))}
.hl{border:1px solid var(--bl);background:#0b1a44;padding:12px;margin-top:10px}.hl em{background:#ff6a3d;color:#fff;font:700 9px ui-monospace,monospace;padding:2px 6px;font-style:normal}
.links a{display:flex;justify-content:space-between;padding:14px;margin:10px 0;border:1px solid var(--bd);background:#0a1636;color:var(--tx);text-decoration:none;font-weight:700;word-break:break-all}
footer{padding:26px 0 46px;text-align:center;color:var(--mu);font:12px ui-monospace,monospace}footer button{background:none;border:1px solid var(--bd);color:var(--mu);padding:6px 12px;cursor:pointer;margin-left:8px;font:inherit}
#pnl{position:fixed;inset:0;background:#000c;display:none;z-index:99;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px}#pnl .box{max-width:640px;margin:auto;background:#0a1226;border:1px solid var(--bd);border-radius:14px;padding:18px}
#pnl label{display:block;margin:12px 0 4px;font:600 11px ui-monospace,monospace;color:var(--mu);letter-spacing:.1em;text-transform:uppercase}
#pnl input[type=text],#pnl input[type=password],#pnl textarea{width:100%;background:#050914;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:14px system-ui}#pnl textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:13px}#pnl small{color:var(--mu);display:block;margin-top:3px}
</style></head><body>
<main id="app"></main>
<div id="pnl"><div class="box" id="box"></div></div>

<div class="cred" id="proof"><div><div class="lan"><div class="idc"><div class="tag" style="color:#29b6f6">${e(f.slice(0,2).toUpperCase())} / BUILDER PASS</div><img src="${e(D.photo)}" alt=""><h4>${e(D.name)}</h4><div class="tag">${e(D.location)}</div><div class="bc"></div></div></div><h2 class="disp" style="color:var(--bl);text-align:center;margin-top:14px">Behind the code.</h2></div>
<div><div class="tag">04 / Builder credentials</div><h2 class="disp">Real work. Real impact.</h2><div class="sts">${D.stats.map(s=>`<div><b>${e(s[1])}</b><span>${e(s[0])}</span></div>`).join("")}</div>
<div class="tag" style="margin-top:16px">Most-starred / public repositories</div>${D.stars.map(s=>`<div class="bar"><div><span>${e(s[0])}</span><span>${+s[1]||0}</span></div><u><i style="width:${Math.min(100,+s[1]||0)}%"></i></u></div>`).join("")}
<div class="hl"><em>${e(D.hl[0])}</em><div class="disp" style="font-size:20px;margin-top:6px">${e(D.hl[1])}</div></div></div></div>
<div class="grid2" id="connect"><div><div class="tag">05 / Start a conversation</div><h2 class="disp" style="font-size:clamp(56px,14vw,100px);color:var(--bl)">Let's<br>connect.</h2></div>
<div><h2 class="disp">Build something great.</h2><p style="color:var(--mu)">${e(D.cta)}</p><div class="links"><a href="${safe(D.linkedin)}" target="_blank" rel="noopener">LinkedIn <span>→</span></a><a href="${safe(D.github)}" target="_blank" rel="noopener">GitHub <span>→</span></a><a href="mailto:${e(D.email)}">${e(D.email)} <span>→</span></a></div></div></div>
<footer>© ${new Date().getFullYear()} ${e(D.name)}<button onclick="openPanel()">Edit site</button></footer>`}
const L=a=>a.map(r=>(Array.isArray(r)?r:[r]).join(" | ")).join("\n");
const parse=t=>t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>x.split("|").map(y=>y.trim()));
function openPanel(){const p=document.getElementById("pnl"),b=document.getElementById("box");p.style.display="block";
b.innerHTML=`<h3>Edit site</h3><label>Passcode</label><input type="password" id="pc" autocomplete="off"><p><button class="btn" onclick="unlock()">Unlock</button><button class="btn o" onclick="closeP()">Close</button></p><small>Edits save only in this browser. The passcode is in the page code, so this is a convenience lock, not real security.</small>`}
function closeP(){document.getElementById("pnl").style.display="none"}
function unlock(){if(document.getElementById("pc").value!==PASS){alert("Wrong passcode");return}
const t=(k,l)=>`<label>${l}</label><input type="text" id="f_${k}" value="${e(D[k])}">`,a=(k,l,h)=>`<label>${l}</label><textarea id="f_${k}">${e(L(D[k]))}</textarea><small>${h}</small>`;
document.getElementById("box").innerHTML=`<h3>Edit everything</h3>${t("name","Name")}${t("role","Role")}${t("tagline","Tagline")}${t("location","Location")}${t("org","College / company")}${t("open","Status badge")}${t("badge","Photo badge")}${t("email","Email")}${t("linkedin","LinkedIn URL")}${t("github","GitHub URL")}${t("cmd","Terminal command")}${t("mtitle","Second card title")}${t("cta","Contact line")}
<label>Profile image (hero + ID card)</label><input type="file" accept="image/*" onchange="img(this,'photo')"><label>Second image</label><input type="file" accept="image/*" onchange="img(this,'photo2')">
${a("stats","Stats / credentials","Label | Value (3 lines)")}${a("flow","Flow steps","One per line (3)")}${a("ideas","Ideas","Title | Description")}${a("work","Work / steps","Title | Description")}${a("mcta","Mentor call-to-action","Title | Description")}${a("projects","Projects","Name | What it does | Focus")}${a("stars","Stars / repositories","Repo name | number 0-100")}${a("tools","Tools","Category | tool, tool, tool")}${a("hl","Highlight","Tag | Text")}
<p><button class="btn" onclick="save()">Save</button><button class="btn o" onclick="closeP()">Cancel</button><button class="btn o" onclick="if(confirm('Reset all edits?')){try{localStorage.removeItem(KEY)}catch(x){};location.reload()}">Reset</button></p>`}
function img(inp,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,700/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);D[k]=c.toDataURL("image/jpeg",.8);render()};i.src=r.result};r.readAsDataURL(f)}
function save(){const g=k=>document.getElementById("f_"+k).value;["name","role","tagline","location","org","open","badge","email","linkedin","github","cmd","mtitle","cta"].forEach(k=>D[k]=g(k));
["stats","ideas","projects","work","stars","tools","mcta","hl"].forEach(k=>D[k]=parse(g(k)));D.flow=parse(g("flow")).map(x=>x[0]);
try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){alert("Saved for this visit, but the browser could not store it (images may be too large).")}render();closeP()}
render();
</script></body></html>
